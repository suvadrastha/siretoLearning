spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/leave-management-system
          jwk-set-uri: http://localhost:9090/realms/leave-management-system/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:5432/leave-management
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
        ddl-auto: update

    show-sql: true

logging:
  level:
    org:
      springframework:
        security: DEBUG

jwt:
  auth:
    converter:
      resource-id: leave-management-web
      principle-attribute: preferred_username


keycloak:
  token-url: http://localhost:9090/realms/leave-management-system/protocol/openid-connect/token
  client-id: leave-management-web
  client-secret: emanbfVfDLqtnkmRchIoLriPDYzd7tYz