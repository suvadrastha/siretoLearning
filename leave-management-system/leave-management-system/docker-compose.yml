services:
  postgres:
    container_name: leave_management_postgres
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: leave-management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leave-management"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: keycloak_demo
    image: quay.io/keycloak/keycloak:25.0.5
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    command:
      - start-dev
      - --import-realm

volumes:
  postgres_data:
  keycloak_data:
